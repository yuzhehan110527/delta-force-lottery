<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e12"/>
      <stop offset="100%" style="stop-color:#1a2332"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Diamond shape -->
  <polygon points="256,60 440,256 256,452 72,256" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>
  <polygon points="256,120 380,256 256,392 132,256" fill="url(#diamond)" opacity="0.3"/>
  <!-- Crosshair -->
  <line x1="256" y1="80" x2="256" y2="432" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.5"/>
  <!-- Text -->
  <text x="256" y="280" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="64" font-weight="bold">抽取</text>
  <text x="256" y="350" text-anchor="middle" fill="#5a6270" font-family="sans-serif" font-size="28" letter-spacing="4">DELTA FORCE</text>
</svg>