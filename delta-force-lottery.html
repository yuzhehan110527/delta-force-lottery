<style>
  :root { color-scheme: dark; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #0b0e12;
    color: #c8cdd4;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
    pointer-events: none;
    z-index: -1;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(30,41,59,0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,41,59,0.12) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .ambient-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.07;
    pointer-events: none;
    z-index: 0;
    background: radial-gradient(circle, #22c55e, #3b82f6);
    top: -250px;
    left: 50%;
    transform: translateX(-50%);
    animation: ambientPulse 8s ease-in-out infinite;
  }

  @keyframes ambientPulse {
    0%, 100% { opacity: 0.05; transform: translateX(-50%) scale(1); }
    50% { opacity: 0.10; transform: translateX(-50%) scale(1.12); }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 16px 12px 60px;
  }
  @media (min-width: 560px) {
    .app { padding: 24px 20px 80px; }
  }

  .header {
    text-align: center;
    padding: 20px 0 18px;
  }
  @media (min-width: 560px) {
    .header { padding: 36px 0 28px; }
  }

  .header-badge {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 3px;
    color: #f59e0b;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid rgba(245,158,11,0.35);
    border-radius: 2px;
    margin-bottom: 10px;
    background: rgba(245,158,11,0.06);
  }
  @media (min-width: 560px) {
    .header-badge { font-size: 10px; letter-spacing: 5px; padding: 5px 14px; margin-bottom: 14px; }
  }

  .header h1 {
    font-family: 'Impact', 'PingFang SC', sans-serif;
    font-size: clamp(1.3rem, 5.5vw, 2.6rem);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #e8ecf1;
    text-shadow: 0 2px 16px rgba(0,0,0,0.6);
    line-height: 1.2;
  }

  .header h1 span { color: #f59e0b; }

  .header p {
    margin-top: 4px;
    color: #5a6270;
    font-size: 11px;
    letter-spacing: 1px;
  }
  @media (min-width: 560px) {
    .header p { font-size: 13px; letter-spacing: 2px; margin-top: 6px; }
  }

  .divider {
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #f59e0b, transparent);
    margin: 0 auto 20px;
  }
  @media (min-width: 560px) {
    .divider { width: 50px; margin: 0 auto 28px; }
  }

  .draw-section { text-align: center; margin-bottom: 20px; }
  @media (min-width: 560px) {
    .draw-section { margin-bottom: 32px; }
  }

  .draw-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    width: calc(100% - 24px);
    max-width: 340px;
    justify-content: center;
    background: linear-gradient(135deg, #d97706, #b45309);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s ease;
    box-shadow: 0 4px 24px rgba(217,119,6,0.22);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  @media (min-width: 560px) {
    .draw-btn { width: auto; padding: 15px 44px; font-size: 17px; letter-spacing: 3px; border-radius: 3px; }
  }

  .draw-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    transition: left 0.5s;
  }
  .draw-btn:hover::before { left: 100%; }
  .draw-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 32px rgba(217,119,6,0.32);
  }
  .draw-btn:active { transform: translateY(0); }
  .draw-btn.pulling { pointer-events: none; opacity: 0.8; }
	  /* 子弹过滤按钮 */
	  .filter-section {
	    text-align: center;
	    margin-bottom: 14px;
	    display: flex;
	    flex-wrap: wrap;
	    gap: 8px;
	    justify-content: center;
	    padding: 0 8px;
	  }
	  @media (min-width: 560px) {
	    .filter-section { gap: 10px; margin-bottom: 20px; }
	  }
	  .filter-btn {
	    display: inline-flex;
	    align-items: center;
	    gap: 5px;
	    padding: 8px 14px;
	    background: rgba(13,18,27,0.8);
	    border: 1px solid rgba(45,55,72,0.5);
	    border-radius: 20px;
	    color: #64748b;
	    font-size: 12px;
	    font-weight: 500;
	    cursor: pointer;
	    letter-spacing: 0.5px;
	    transition: all 0.2s ease;
	    -webkit-tap-highlight-color: transparent;
	    touch-action: manipulation;
	    user-select: none;
	    -webkit-user-select: none;
	  }
	  .filter-btn:hover {
	    border-color: rgba(245,158,11,0.5);
	    color: #94a3b8;
	  }
	  .filter-btn.active {
	    background: rgba(239,68,68,0.15);
	    border-color: rgba(239,68,68,0.6);
	    color: #ef4444;
	    box-shadow: 0 0 12px rgba(239,68,68,0.12);
	  }
	  .filter-dot {
	    width: 7px;
	    height: 7px;
	    border-radius: 50%;
	    background: currentColor;
	    transition: all 0.2s;
	  }
	  .filter-btn.active .filter-dot {
	    background: #ef4444;
	    box-shadow: 0 0 6px rgba(239,68,68,0.6);
	  }
	  @media (min-width: 560px) {
	    .filter-btn { padding: 8px 16px; font-size: 13px; border-radius: 22px; }
	  }


  .results {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  @media (min-width: 560px) {
    .results { grid-template-columns: 1fr 1fr; gap: 10px; }
  }

  .card {
    background: rgba(13,18,27,0.85);
    border: 1px solid rgba(45,55,72,0.55);
    border-radius: 4px;
    padding: 14px 12px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    backdrop-filter: blur(6px);
    -webkit-tap-highlight-color: transparent;
  }
  @media (min-width: 560px) {
    .card { padding: 16px 15px; border-radius: 3px; }
  }

  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,158,11,0.5), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card.revealed::after { opacity: 1; }

  .card-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #5a6270;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  @media (min-width: 560px) {
    .card-label { font-size: 10px; letter-spacing: 2.5px; margin-bottom: 8px; }
  }

  .card-label::before {
    content: '';
    width: 5px;
    height: 5px;
    background: #2d3748;
    border-radius: 1px;
  }
  .card.revealed .card-label::before { background: #f59e0b; }

  .card-value {
    font-size: 15px;
    font-weight: 600;
    color: #8b94a3;
    min-height: 22px;
    transition: all 0.3s ease;
    word-break: break-all;
  }
  .card.revealed .card-value { color: #dde2ea; }

  .card-value.highlight {
    color: #f59e0b !important;
    font-weight: 700;
    font-size: 18px;
  }

  .card-value.placeholder {
    color: #2d3748;
    font-style: italic;
    font-weight: 400;
  }

  .card.rolling .card-value {
    animation: textBlur 0.07s steps(1) infinite;
  }
  @keyframes textBlur {
    0%, 100% { opacity: 0.35; transform: translateY(-2px); }
    50% { opacity: 0.75; transform: translateY(2px); }
  }

  @keyframes revealPulse {
    0% { border-color: rgba(245,158,11,0.9); box-shadow: 0 0 22px rgba(245,158,11,0.18); }
    100% { border-color: rgba(45,55,72,0.55); box-shadow: none; }
  }
  .card.revealed { animation: revealPulse 0.6s ease-out; }

  .card.full-width { grid-column: 1 / -1; }
	  .card-bullet-info {
	    display: flex;
	    align-items: baseline;
	    gap: 0;
	    flex-wrap: wrap;
	  }
	  .card-bullet-tier {
	    display: inline-block;
	    font-size: 11px;
	    font-weight: 700;
	    color: #f59e0b;
	    background: rgba(245,158,11,0.12);
	    padding: 1px 7px;
	    border-radius: 3px;
	    margin-right: 8px;
	    letter-spacing: 0.5px;
	  }
	  .card-bullet-cal {
	    font-size: 12px;
	    font-weight: 500;
	    color: #64748b;
	    margin-right: 6px;
	  }
	  .card-bullet-name {
	    font-size: 14px;
	    font-weight: 600;
	    color: #dde2ea;
	  }
	  .card.revealed .card-bullet-name { color: #e8ecf1; }
	  .card-bullet-tier, .card-bullet-cal, .card-bullet-name { line-height: 1.6; }
	  @media (min-width: 560px) {
	    .card-bullet-tier { font-size: 10px; padding: 2px 8px; }
	    .card-bullet-cal { font-size: 12px; }
	    .card-bullet-name { font-size: 14px; }
	  }


  .footer {
    text-align: center;
    padding: 30px 0 16px;
    color: #2d3748;
    font-size: 10px;
    letter-spacing: 1px;
  }
  @media (min-width: 560px) {
    .footer { padding: 40px 0 20px; font-size: 11px; }
  }

  .dice-svg { transition: transform 0.3s ease; }
  .draw-btn:hover .dice-svg { transform: rotate(15deg); }
  .draw-btn.pulling .dice-svg { animation: diceSpin 0.6s ease-in-out; }
  @keyframes diceSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .card-ammo-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .card-ammo-bullet {
    font-size: 14px;
    font-weight: 700;
    color: #f59e0b;
  }
  .card-ammo-meta {
    font-size: 11px;
    color: #5a6270;
  }

  /* Admin panel */
  .admin-corner-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(30,41,59,0.85);
    border: 1px solid rgba(51,65,85,0.5);
    color: #4b5563;
    font-size: 18px;
    cursor: pointer;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .admin-corner-btn:hover {
    border-color: rgba(245,158,11,0.5);
    color: #f59e0b;
  }
  .admin-corner-btn.active {
    border-color: rgba(245,158,11,0.8);
    color: #f59e0b;
    background: rgba(245,158,11,0.15);
  }

  .admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .admin-overlay.open { display: flex; }

  .admin-dialog {
    background: #111827;
    border: 1px solid rgba(51,65,85,0.6);
    border-radius: 8px;
    width: 94%;
    max-width: 440px;
    max-height: 88vh;
    max-height: 88dvh;
    overflow-y: auto;
    padding: 20px 16px 16px;
    -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 560px) {
    .admin-dialog { width: 90%; padding: 24px 22px 20px; border-radius: 6px; max-height: 85vh; }
  }

  .admin-dialog h3 {
    font-size: 16px;
    font-weight: 700;
    color: #e2e8f0;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .admin-dialog .admin-subtitle {
    font-size: 12px;
    color: #5a6270;
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .admin-group {
    margin-bottom: 14px;
  }
  .admin-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #64748b;
    margin-bottom: 5px;
  }
  .admin-group textarea {
    width: 100%;
    min-height: 80px;
    padding: 10px 12px;
    background: #0b0f17;
    border: 1px solid rgba(51,65,85,0.5);
    border-radius: 3px;
    color: #c8cdd4;
    font-family: 'PingFang SC','Microsoft YaHei',monospace;
    font-size: 12px;
    line-height: 1.6;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .admin-group textarea:focus {
    outline: none;
    border-color: rgba(245,158,11,0.6);
  }
  .admin-group .hint {
    font-size: 10px;
    color: #4b5563;
    margin-top: 3px;
  }

  .admin-actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .admin-actions button {
    flex: 1;
    padding: 12px 0;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .admin-btn-save {
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #fff;
  }
  .admin-btn-save:hover { box-shadow: 0 2px 12px rgba(217,119,6,0.3); }
  .admin-btn-close {
    background: rgba(51,65,85,0.3);
    color: #94a3b8;
    border: 1px solid rgba(51,65,85,0.5) !important;
  }
  .admin-btn-close:hover { background: rgba(51,65,85,0.5); }

  /* Admin source code editor */
  .admin-source-area {
    width: 100%;
    min-height: 260px;
    max-height: 45vh;
    max-height: 45dvh;
    padding: 12px 12px;
    font-size: 11px;
    background: #060b12;
    border: 1px solid rgba(51,65,85,0.6);
    border-radius: 4px;
    color: #dde2ea;
    font-family: 'SF Mono','Cascadia Code','Consolas','PingFang SC',monospace;
    font-size: 12.5px;
    line-height: 1.75;
    resize: vertical;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
    transition: border-color 0.2s;
  }
  .admin-source-area:focus {
    outline: none;
    border-color: rgba(245,158,11,0.6);
  }
  /* 概率滑块设置 */
  .prob-settings { display: flex; flex-direction: column; gap: 8px; margin-bottom: 2px; }
  .prob-item { background: rgba(13,18,27,0.7); border: 1px solid rgba(45,55,72,0.5); border-radius: 4px; padding: 10px 12px; }
  .prob-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .prob-label { font-size: 13px; color: #c8cdd4; font-weight: 500; }
  .prob-val { font-size: 14px; font-weight: 700; color: #22c55e; min-width: 36px; text-align: right; }
  .prob-slider { width: 100%; height: 8px; -webkit-appearance: none; appearance: none; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); border-radius: 4px; outline: none; cursor: pointer; margin-top: 2px; }
  .prob-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #f59e0b; border: 2px solid #d97706; cursor: pointer; transition: all 0.15s; }
  .prob-slider::-webkit-slider-thumb:hover { background: #fbbf24; transform: scale(1.1); }

// ===== 抽取逻辑 =====
function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// 带权重的随机选择（每一项都可选 weight 字段，默认为1）
function weightedRandomItem(arr) {
  var total = arr.reduce(function(sum, item) { return sum + (item.weight !== undefined ? item.weight : 1); }, 0);
  if (total <= 0) return arr[Math.floor(Math.random() * arr.length)];
  var r = Math.random() * total;
  for (var i = 0; i < arr.length; i++) {
    var w = arr[i].weight !== undefined ? arr[i].weight : 1;
    r -= w;
    if (r <= 0) return arr[i];
  }
  return arr[arr.length - 1];
}
function pickWithProb(p) { return Math.random() < p; }

// 从子弹名称中提取等级数字（如 "3级 · FMJ"→3，"特4级 · AP"→4）
function extractTier(ammoName) {
  const m = ammoName.match(/(\d+)级/);
  return m ? parseInt(m[1], 10) : 99;
}

// 在指定最高等级限制内挑选子弹（保持原有权重分布）
function getBulletForMaxTier(entry, maxTier) {
  const all = entry.ammo;
  const pool = all.filter(a => extractTier(a) <= maxTier);
  if (pool.length === 0) return all[0]; // 没有符合的，返回最低级
  // 为过滤后的池重建权重
  const idxMap = pool.map(a => all.indexOf(a));
  let rawWeights;
  const n = pool.length;
  switch (n) {
    case 1: return pool[0];
    case 2: rawWeights = [0.30, 0.70]; break;
    case 3: rawWeights = [0.15, 0.35, 0.50]; break;
    case 4: rawWeights = [0.10, 0.20, 0.45, 0.25]; break;
    case 5: rawWeights = [0.05, 0.10, 0.25, 0.40, 0.20]; break;
    case 6: rawWeights = [0.05, 0.08, 0.12, 0.18, 0.32, 0.25]; break;
    case 7: rawWeights = [0.03, 0.05, 0.08, 0.12, 0.20, 0.30, 0.22]; break;
    default: rawWeights = pool.map(() => 1/n);
  }
  let r = Math.random(), acc = 0;
  for (let i = 0; i < n; i++) {
    acc += rawWeights[i];
    if (r <= acc) return pool[i];
  }
  return pool[n - 1];
}

function getBulletFor(entry) {
  const levels = entry.ammo;
  // 偏重高级弹：越高级概率越大（动态权重）
  let weights;
  switch (levels.length) {
    case 2: weights = [0.30, 0.70]; break;
    case 3: weights = [0.15, 0.35, 0.50]; break;
    case 4: weights = [0.10, 0.20, 0.45, 0.25]; break;
    case 5: weights = [0.05, 0.10, 0.25, 0.40, 0.20]; break;
    case 6: weights = [0.05, 0.08, 0.12, 0.18, 0.32, 0.25]; break;
    case 7: weights = [0.03, 0.05, 0.08, 0.12, 0.20, 0.30, 0.22]; break;
    case 8: weights = [0.03, 0.05, 0.05, 0.10, 0.14, 0.20, 0.25, 0.18]; break;
    case 9: weights = [0.02, 0.03, 0.05, 0.05, 0.08, 0.15, 0.22, 0.25, 0.15]; break;
    default: weights = levels.map(() => 1/levels.length);
  }
  let r = Math.random(), acc = 0;
  for (let i = 0; i < levels.length; i++) {
    acc += weights[i];
    if (r <= acc) return levels[i];
  }
  return levels[levels.length - 1];
}

// 子弹过滤开关
let disableTier7 = false;
let disableTier6 = false;
let disableSpecialExceptMeat = false;

function toggleFilter(type) {
  if (type === 'tier7') { disableTier7 = !disableTier7; }
  if (type === 'tier6') { disableTier6 = !disableTier6; }
  if (type === 'special') { disableSpecialExceptMeat = !disableSpecialExceptMeat; }
  updateFilterButtons();
}

function updateFilterButtons() {
  const b7 = document.getElementById('filtTier7');
  const b6 = document.getElementById('filtTier6');
  const bs = document.getElementById('filtSpecial');
  if (disableTier7) b7.classList.add('active'); else b7.classList.remove('active');
  if (disableTier6) b6.classList.add('active'); else b6.classList.remove('active');
  if (disableSpecialExceptMeat) bs.classList.add('active'); else bs.classList.remove('active');
}

function isMeatBullet(name) {
  return name.includes('肉弹') || name.includes('肉蛋');
}

function isSpecialBullet(name) {
  return name.startsWith('特');
}

// 获取过滤后的子弹列表
function getFilteredAmmo(ammoList, maxTier) {
  return ammoList.filter(a => {
    const tier = extractTier(a);
    if (disableTier7 && tier === 7) return false;
    if (disableTier6 && tier === 6) return false;
    if (disableSpecialExceptMeat && isSpecialBullet(a) && !isMeatBullet(a)) return false;
    if (tier > maxTier) return false;
    return true;
  });
}

// 检查武器条目是否还有有效子弹
function hasValidAmmo(entry, maxTier) {
  return getFilteredAmmo(entry.ammo, maxTier).length > 0;
}

// 从过滤后的子弹池中按权重挑选
function pickWeightedBullet(filtered) {
  const n = filtered.length;
  if (n === 0) return null;
  if (n === 1) return filtered[0];
  let weights;
  switch (n) {
    case 2: weights = [0.30, 0.70]; break;
    case 3: weights = [0.15, 0.35, 0.50]; break;
    case 4: weights = [0.10, 0.20, 0.45, 0.25]; break;
    case 5: weights = [0.05, 0.10, 0.25, 0.40, 0.20]; break;
    case 6: weights = [0.05, 0.08, 0.12, 0.18, 0.32, 0.25]; break;
    case 7: weights = [0.03, 0.05, 0.08, 0.12, 0.20, 0.30, 0.22]; break;
    case 8: weights = [0.03, 0.05, 0.05, 0.10, 0.14, 0.20, 0.25, 0.18]; break;
    case 9: weights = [0.02, 0.03, 0.05, 0.05, 0.08, 0.15, 0.22, 0.25, 0.15]; break;
    default: weights = filtered.map(() => 1/n);
  }
  let r = Math.random(), acc = 0;
  for (let i = 0; i < n; i++) { acc += weights[i]; if (r <= acc) return filtered[i]; }
  return filtered[n - 1];
}


function generateResults() {
  const allWeapons = Object.keys(weaponCaliberMap);

  // 分类：主武器限定 冲锋枪 + 步枪（突击/战斗/杠杆）
  //       副武器限定 射手步枪 + 狙击步枪 + 霰弹枪
  const isPrimary = n =>
    n.includes("冲锋枪") ||
    n.includes("突击步枪") || n.includes("战斗步枪") || n.includes("杠杆步枪") ||
    n.includes("轻机枪") || n.includes("通用机枪") ||
    (n.includes("步枪") && !n.includes("射手") && !n.includes("狙击"));
  const isSecondary = n =>
    n.includes("射手步枪") || n.includes("狙击步枪") || n.includes("霰弹枪") ||
    n.includes("复合弓");

  const primaryPool = allWeapons.filter(isPrimary);
  const secondaryPool = allWeapons.filter(isSecondary);

  // 先抽地图，低等级地图限制子弹等级
  const map = weightedRandomItem(maps).name;
  const mapMaxTier = LOW_TIER_MAPS.has(map) ? 3 : 99;

  // 检查武器在过滤+地图限制后是否仍有有效子弹
  const wHasValid = (entry) => hasValidAmmo(entry, mapMaxTier);

  // 过滤武器池：只保留至少有一发有效子弹的武器
  const filteredPrimaryPool = primaryPool.filter(n => wHasValid(weaponCaliberMap[n]));
  const filteredSecondaryPool = secondaryPool.filter(n => wHasValid(weaponCaliberMap[n]));
  const filteredPistols = pistols.filter(p => {
    const pEntry = { ammo: p.ammo };
    return hasValidAmmo(pEntry, mapMaxTier);
  });

  // 主武器
  let w1Display, w1Bullet, w1Cal;
  const w1Candidates = filteredPrimaryPool.length > 0 ? filteredPrimaryPool : primaryPool;
  if (Math.random() < w1EmptyProb) {
    w1Display = "无主武器";
    w1Bullet = "—";
    w1Cal = "";
  } else {
    const w1PoolWithWeight = w1Candidates.map(function(n) { return { name: n, weight: weaponCaliberMap[n].weight || 1 }; });
    const w1Name = weightedRandomItem(w1PoolWithWeight).name;
    const w1Entry = weaponCaliberMap[w1Name];
    const filteredAmmo = getFilteredAmmo(w1Entry.ammo, mapMaxTier);
    const rawBullet = filteredAmmo.length > 0 ? pickWeightedBullet(filteredAmmo) : w1Entry.ammo[0];
    w1Bullet = rawBullet;
    w1Cal = w1Entry.cal;
    w1Display = w1Name;
  }

  // 副武器
  let w2Display, w2Bullet, w2Cal;
  const w2Candidates = (filteredSecondaryPool.length > 0 ? filteredSecondaryPool : secondaryPool).filter(n => n !== w1Display);
  if (w2Candidates.length === 0 || Math.random() < w2EmptyProb) {
    w2Display = "无副武器";
    w2Bullet = "—";
    w2Cal = "";
  } else {
    const w2Pool = w2Candidates.length > 0 ? w2Candidates : secondaryPool.filter(n => n !== w1Display);
    var w2PoolActual = w2Pool.length > 0 ? w2Pool : secondaryPool;
    var w2PoolWithWeight = w2PoolActual.map(function(n) { return { name: n, weight: weaponCaliberMap[n].weight || 1 }; });
    const w2Name = weightedRandomItem(w2PoolWithWeight).name;
    w2Display = w2Name;
    const w2Entry = weaponCaliberMap[w2Name];
    const filteredAmmo2 = getFilteredAmmo(w2Entry.ammo, mapMaxTier);
    const rawBullet2 = filteredAmmo2.length > 0 ? pickWeightedBullet(filteredAmmo2) : w2Entry.ammo[0];
    w2Bullet = rawBullet2;
    w2Cal = w2Entry.cal;
  }

  // 手枪
  let pDisplay, pBullet, pCal;
  const pCandidates = filteredPistols.length > 0 ? filteredPistols : pistols;
  if (Math.random() < pEmptyProb) {
    pDisplay = "无手枪";
    pBullet = "—";
    pCal = "";
  } else {
    const pEntry = weightedRandomItem(pCandidates);
    pDisplay = pEntry.name;
    pCal = pEntry.cal;
    const filteredAmmo3 = getFilteredAmmo(pEntry.ammo, mapMaxTier);
    const rawBullet3 = filteredAmmo3.length > 0 ? pickWeightedBullet(filteredAmmo3) : pEntry.ammo[0];
    pBullet = rawBullet3;
  }

  // 装备（低等级地图排除高阶护甲/头盔）
  const filteredHelmets = LOW_TIER_MAPS.has(map)
    ? helmets.filter(h => !LOW_TIER_RESTRICTED_HELMETS.has(h))
    : helmets;
  const filteredArmors = LOW_TIER_MAPS.has(map)
    ? armors.filter(a => !LOW_TIER_RESTRICTED_ARMORS.has(a))
    : armors;
  const helmet = weightedRandomItem(filteredHelmets.length > 0 ? filteredHelmets : helmets).name;
  const armor = weightedRandomItem(filteredArmors.length > 0 ? filteredArmors : armors).name;
  const vest = weightedRandomItem(vests).name;
  const backpack = weightedRandomItem(backpacks).name;
  const operator = weightedRandomItem(operators).name;

  // 辅助：从子弹名提取等级显示
  const formatBullet = (bullet, cal) => {
    if (bullet === "—" || !bullet) return bullet;
    const tier = extractTier(bullet);
    return { tier, cal, name: bullet.replace(/^(特)?\d+级 · /, "") };
  };

  const a1Info = w1Bullet !== "—" ? formatBullet(w1Bullet, w1Cal) : null;
  const a2Info = w2Bullet !== "—" ? formatBullet(w2Bullet, w2Cal) : null;
  const paInfo = pBullet !== "—" ? formatBullet(pBullet, pCal) : null;

  return {
    w1: w1Display,
    a1: a1Info,
    w2: w2Display,
    a2: a2Info,
    pistol: pDisplay,
    pa: paInfo,
    helmet, armor, vest, backpack,
    operator, map
  };
}

function parseWeaponLines(text) {
  const map = {};
  text.split('\n').forEach(line => {
    line = line.trim();
    if (!line) return;
    const parts = line.split('|');
    if (parts.length < 3) return;
    const name = parts[0].trim();
    const cal = parts[1].trim();
    const ammo = parts[2].split(',').map(s => s.trim()).filter(Boolean);
    if (name && cal && ammo.length > 0) {
      map[name] = { cal, ammo };
    }
  });
  return map;
}

    if (parts.length < 3) return;
    const name = parts[0].trim();
    const cal = parts[1].trim();
    const ammo = parts[2].split(',').map(s => s.trim()).filter(Boolean);
    if (name && cal && ammo.length > 0) {
      arr.push({ name, cal, ammo });

	    var o = document.getElementById('adminOverlay');
	    if (o) o.classList.remove('open');
	  } catch(e) {}
	}

	function saveData() {
	  const src = document.getElementById('admin-source').value.trim();
	  if (!src) { alert('源代码为空'); return; }

	  try {
	    // 使用 Function 构造器执行用户源码，捕获所有变量
	    const fn = new Function(`
	      let weaponCaliberMap = {};
	      let pistols = [];
	      let helmets = [];
	      let armors = [];
	      let vests = [];
	      let backpacks = [];
	      let operators = [];
	      let maps = [];
	      let w2EmptyProb = 0.35;
	      let pEmptyProb = 0.30;

	      ${src}

	      return {
	        weaponCaliberMap,
	        pistols,
	        helmets,
	        armors,
	        vests,
	        backpacks,
	        operators,
	        maps,
	        w1EmptyProb,
	        w2EmptyProb,
	        pEmptyProb
	      };
	    `);

	    const result = fn();

	    // 验证
	    if (Object.keys(result.weaponCaliberMap).length === 0) throw new Error('weaponCaliberMap 至少需要一个武器');
	    if (!Array.isArray(result.pistols) || result.pistols.length === 0) throw new Error('pistols 至少需要一个手枪');
	    if (!Array.isArray(result.helmets) || result.helmets.length === 0) throw new Error('helmets 至少需要一个头盔');
	    if (!Array.isArray(result.armors) || result.armors.length === 0) throw new Error('armors 至少需要一个护甲');
	    if (!Array.isArray(result.vests) || result.vests.length === 0) throw new Error('vests 至少需要一个弹挂');
	    if (!Array.isArray(result.backpacks) || result.backpacks.length === 0) throw new Error('backpacks 至少需要一个背包');
	    if (!Array.isArray(result.operators) || result.operators.length === 0) throw new Error('operators 至少需要一个干员');
	    if (!Array.isArray(result.maps) || result.maps.length === 0) throw new Error('maps 至少需要一个地图');
	    if (typeof result.w1EmptyProb !== 'number' || result.w1EmptyProb < 0 || result.w1EmptyProb > 1) throw new Error('w1EmptyProb 必须为 0-1 之间的数字');
		    if (typeof result.w2EmptyProb !== 'number' || result.w2EmptyProb < 0 || result.w2EmptyProb > 1) throw new Error('w2EmptyProb 必须为 0-1 之间的数字');
	    if (typeof result.pEmptyProb !== 'number' || result.pEmptyProb < 0 || result.pEmptyProb > 1) throw new Error('pEmptyProb 必须为 0-1 之间的数字');

	    // 应用更改 — weaponCaliberMap
	    Object.keys(weaponCaliberMap).forEach(k => delete weaponCaliberMap[k]);
	    Object.assign(weaponCaliberMap, result.weaponCaliberMap);

	    // 应用 pistols
	    pistols.length = 0;
	    for (const p of result.pistols) {
	      if (typeof p === 'object' && p.name && p.cal && p.ammo) {
	        pistols.push(p);
	      } else if (typeof p === 'string') {
	        const parts = p.split('|');
	        if (parts.length >= 3) {
	          pistols.push({ name: parts[0].trim(), cal: parts[1].trim(), ammo: parts[2].split(',').map(s=>s.trim()) });
	        } else {
	          pistols.push({ name: p, cal: 'unknown', ammo: ['default'] });
	        }
	      }
	    }

	    // 应用装备
	    helmets.length = 0;
		    for (const item of result.helmets) { helmets.push(typeof item === 'string' ? { name: item, weight: 1 } : item); }
	    armors.length = 0;
		    for (const item of result.armors) { armors.push(typeof item === 'string' ? { name: item, weight: 1 } : item); }
	    vests.length = 0;
		    for (const item of result.vests) { vests.push(typeof item === 'string' ? { name: item, weight: 1 } : item); }
	    backpacks.length = 0;
		    for (const item of result.backpacks) { backpacks.push(typeof item === 'string' ? { name: item, weight: 1 } : item); }
	    operators.length = 0;
		    for (const o of result.operators) { operators.push(typeof o === 'string' ? { name: o, weight: 1 } : o); }
	    maps.length = 0;
		    for (const m of result.maps) { maps.push(typeof m === 'string' ? { name: m, weight: 1 } : m); }

	    w1EmptyProb = result.w1EmptyProb;
	    w2EmptyProb = result.w2EmptyProb;
	    pEmptyProb = result.pEmptyProb;

	    closeAdmin();
	    alert('✅ 数据已更新！');
	  } catch (e) {
	    alert('❌ 保存失败：' + (typeof e === 'string' ? e : e.message || '数据格式有误'));
	  }
	}

	</script>
